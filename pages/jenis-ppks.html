<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jenis PPKS - SIP-PPKS</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class'
        }
    </script>
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-slate-50 dark:bg-slate-900 font-sans flex h-screen overflow-hidden text-slate-800 dark:text-slate-100 transition-colors duration-200">

    <aside class="w-64 bg-white dark:bg-slate-800 flex flex-col justify-between p-4 border-r border-slate-200 dark:border-slate-700/60 shrink-0 print:hidden transition-colors duration-200">
        <div>
            <div class="flex items-center gap-3 mb-8 px-2">
                <i data-lucide="users" class="w-7 h-7 text-emerald-600 dark:text-emerald-400"></i>
                <span class="text-lg font-bold tracking-wide dark:text-white">SIP-PPKS</span>
            </div>
            
            <nav class="space-y-1">
                <a href="dashboard.html" class="flex items-center gap-3 px-4 py-2.5 rounded-lg text-slate-600 dark:text-slate-300 hover:bg-emerald-50 dark:hover:bg-slate-700/50 hover:text-emerald-600 dark:hover:text-emerald-400 font-medium text-sm transition-all duration-200 hover:translate-x-1">
                    <i data-lucide="layout-dashboard" class="w-4 h-4"></i>
                    <span>Dashboard</span>
                </a>
                <a href="ppks.html" class="flex items-center gap-3 px-4 py-2.5 rounded-lg text-slate-600 dark:text-slate-300 hover:bg-emerald-50 dark:hover:bg-slate-700/50 hover:text-emerald-600 dark:hover:text-emerald-400 font-medium text-sm transition-all duration-200 hover:translate-x-1">
                    <i data-lucide="user-check" class="w-4 h-4"></i>
                    <span>Data PPKS</span>
                </a>
                <a href="jenis-ppks.html" class="flex items-center gap-3 px-4 py-2.5 rounded-lg bg-emerald-600 dark:bg-emerald-600 text-white font-medium text-sm shadow-md shadow-emerald-600/20 transition-all duration-200">
                    <i data-lucide="tags" class="w-4 h-4"></i>
                    <span>Jenis PPKS</span>
                </a>
                <a href="laporan.html" class="flex items-center gap-3 px-4 py-2.5 rounded-lg text-slate-600 dark:text-slate-300 hover:bg-emerald-50 dark:hover:bg-slate-700/50 hover:text-emerald-600 dark:hover:text-emerald-400 font-medium text-sm transition-all duration-200 hover:translate-x-1">
                    <i data-lucide="file-text" class="w-4 h-4"></i>
                    <span>Laporan</span>
                </a>
            </nav>
        </div>

        <div class="space-y-3">
            <button type="button" onclick="toggleTheme()" class="w-full flex items-center justify-between px-3 py-2 rounded-lg bg-slate-100 dark:bg-slate-700/70 text-slate-700 dark:text-slate-200 text-xs font-semibold hover:bg-emerald-50 dark:hover:bg-slate-700 transition-all cursor-pointer border border-transparent dark:border-slate-600">
                <span class="flex items-center gap-2">
                    <i data-lucide="sun" class="w-4 h-4 text-emerald-500 hidden dark:block"></i>
                    <i data-lucide="moon" class="w-4 h-4 text-emerald-600 block dark:hidden"></i>
                    <span id="themeLabel">Mode Terang</span>
                </span>
                <span class="text-[10px] bg-emerald-100 dark:bg-emerald-900/50 px-1.5 py-0.5 rounded text-emerald-700 dark:text-emerald-300 font-bold uppercase">Ubah</span>
            </button>

            <div class="border-t border-slate-200 dark:border-slate-700/60 pt-4 flex items-center justify-between px-2">
                <a href="profile.html" class="flex items-center gap-2 group cursor-pointer flex-1 mr-2">
                    <i data-lucide="user-circle" class="w-5 h-5 text-emerald-600 dark:text-emerald-400 group-hover:scale-105 transition-transform shrink-0"></i>
                    <div class="flex flex-col overflow-hidden">
                        <span id="userAdminName" class="text-xs font-semibold text-slate-800 dark:text-slate-100 group-hover:text-emerald-600 dark:group-hover:text-emerald-400 transition-colors truncate">Pengguna</span>
                        <span id="userAdminRole" class="text-[10px] text-slate-500 dark:text-slate-400 truncate">Role</span>
                    </div>
                </a>
                <button type="button" onclick="handleLogout()" class="text-slate-400 hover:text-rose-500 dark:hover:text-rose-400 transition-colors duration-200 p-1.5 rounded-lg hover:bg-rose-500/10 cursor-pointer shrink-0" title="Keluar / Logout">
                    <i data-lucide="log-out" class="w-4 h-4"></i>
                </button>
            </div>
        </div>
    </aside>

    <main class="flex-1 overflow-y-auto p-8 bg-slate-50 dark:bg-slate-900/90">
        <div class="flex items-center justify-between mb-6">
            <div>
                <h1 class="text-2xl font-bold text-slate-800 dark:text-slate-50">Master Jenis PPKS</h1>
                <p class="text-sm text-slate-500 dark:text-slate-400">Daftar kategori Pemerlu Pelayanan Kesejahteraan Sosial.</p>
            </div>
            <button id="btnTambahJenis" onclick="openModal()" class="flex items-center gap-2 px-4 py-2.5 rounded-lg bg-emerald-600 hover:bg-emerald-500 dark:bg-emerald-600 dark:hover:bg-emerald-500 text-white font-medium text-sm shadow-md shadow-emerald-600/20 transition-all cursor-pointer">
                <i data-lucide="plus" class="w-4 h-4"></i>
                <span>Tambah Jenis</span>
            </button>
        </div>

        <div class="bg-white dark:bg-slate-800/80 rounded-xl border border-slate-200 dark:border-slate-700/80 p-6 shadow-sm dark:shadow-md transition-colors duration-200">
            <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse">
                    <thead>
                        <tr class="border-b border-slate-200 dark:border-slate-700 text-xs font-semibold uppercase text-slate-400 dark:text-slate-300 tracking-wider">
                            <th class="py-3.5 px-4">No</th>
                            <th class="py-3.5 px-4">Kode</th>
                            <th class="py-3.5 px-4">Nama Jenis PPKS</th>
                            <th class="py-3.5 px-4">Keterangan</th>
                        </tr>
                    </thead>
                    <tbody id="jenisTableBody" class="divide-y divide-slate-100 dark:divide-slate-700/50">
                        <tr>
                            <td colspan="4" class="text-center py-6 text-slate-400 dark:text-slate-400">Memuat data...</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </main>

    <div id="jenisModal" class="hidden fixed inset-0 bg-slate-900/60 backdrop-blur-sm flex items-center justify-center p-4 z-50">
        <div class="bg-white dark:bg-slate-800 w-full max-w-md rounded-xl border border-slate-200 dark:border-slate-700 p-6 shadow-xl transition-colors duration-200">
            <div class="flex items-center justify-between mb-4">
                <h3 class="text-lg font-bold text-slate-800 dark:text-slate-100">Tambah Jenis PPKS</h3>
                <button type="button" onclick="closeModal()" class="text-slate-400 hover:text-slate-600 dark:hover:text-slate-200 cursor-pointer">
                    <i data-lucide="x" class="w-5 h-5"></i>
                </button>
            </div>
            <form id="formJenisPPKS" onsubmit="handleAddJenisPPKS(event)" class="space-y-4">
                <div>
                    <label class="block text-xs font-medium text-slate-500 dark:text-slate-300 mb-1">Nama Jenis PPKS</label>
                    <select id="namaJenisInput" onchange="autoFillKode()" class="w-full px-3 py-2 rounded-lg border border-slate-200 dark:border-slate-600 bg-slate-50 dark:bg-slate-900 text-slate-800 dark:text-slate-100 text-sm focus:outline-none focus:ring-2 focus:ring-emerald-500" required>
                        <option value="">-- Pilih Jenis PPKS --</option>
                        <option value="Anak Balita Terlantar" data-kode="PPKS-01">Anak Balita Terlantar</option>
                        <option value="Anak Terlantar" data-kode="PPKS-02">Anak Terlantar</option>
                        <option value="Anak yang Berhadapan dengan Hukum" data-kode="PPKS-03">Anak yang Berhadapan dengan Hukum</option>
                        <option value="Anak Jalanan" data-kode="PPKS-04">Anak Jalanan</option>
                        <option value="Anak Kedagunan / Masalah Perilaku" data-kode="PPKS-05">Anak Kedagunan / Masalah Perilaku</option>
                        <option value="Anak Membutuhkan Perlindungan Khusus (AMPK)" data-kode="PPKS-06">Anak Membutuhkan Perlindungan Khusus (AMPK)</option>
                        <option value="Lanjut Usia Terlantar" data-kode="PPKS-07">Lanjut Usia Terlantar</option>
                        <option value="Penyandang Disabilitas" data-kode="PPKS-08">Penyandang Disabilitas</option>
                        <option value="Tuna Susila" data-kode="PPKS-09">Tuna Susila</option>
                        <option value="Gelandangan" data-kode="PPKS-10">Gelandangan</option>
                        <option value="Pengemis" data-kode="PPKS-11">Pengemis</option>
                        <option value="Pemulung" data-kode="PPKS-12">Pemulung</option>
                        <option value="Kelompok Minoritas" data-kode="PPKS-13">Kelompok Minoritas</option>
                        <option value="Bekas Warga Binaan Pemasyarakatan (BWBP)" data-kode="PPKS-14">Bekas Warga Binaan Pemasyarakatan (BWBP)</option>
                        <option value="Orang Dengan HIV/AIDS (ODHA)" data-kode="PPKS-15">Orang Dengan HIV/AIDS (ODHA)</option>
                        <option value="Korban Penyalahgunaan NAPZA" data-kode="PPKS-16">Korban Penyalahgunaan NAPZA</option>
                        <option value="Korban Trafficking (Perdagangan Orang)" data-kode="PPKS-17">Korban Trafficking (Perdagangan Orang)</option>
                        <option value="Korban Tindak Kekerasan" data-kode="PPKS-18">Korban Tindak Kekerasan</option>
                        <option value="Pekerja Migran Bermasalah Sosial (PMBS)" data-kode="PPKS-19">Pekerja Migran Bermasalah Sosial (PMBS)</option>
                        <option value="Korban Bencana Alam" data-kode="PPKS-20">Korban Bencana Alam</option>
                        <option value="Korban Bencana Sosial" data-kode="PPKS-21">Korban Bencana Sosial</option>
                        <option value="Perempuan Rawan Sosial Ekonomi" data-kode="PPKS-22">Perempuan Rawan Sosial Ekonomi</option>
                        <option value="Fakir Miskin" data-kode="PPKS-23">Fakir Miskin</option>
                        <option value="Keluarga Berpotensi Rawan Sosial Ekonomi" data-kode="PPKS-24">Keluarga Berpotensi Rawan Sosial Ekonomi</option>
                        <option value="Keluarga Bermasalah Psikososial" data-kode="PPKS-25">Keluarga Bermasalah Psikososial</option>
                        <option value="Komunitas Adat Terpencil (KAT)" data-kode="PPKS-26">Komunitas Adat Terpencil (KAT)</option>
                    </select>
                </div>

                <div>
                    <label class="block text-xs font-medium text-slate-500 dark:text-slate-300 mb-1">Kode Jenis (Terisi Otomatis)</label>
                    <input type="text" id="kodeJenisInput" placeholder="PPKS-XX" class="w-full px-3 py-2 rounded-lg border border-slate-200 dark:border-slate-600 bg-slate-50 dark:bg-slate-900 text-slate-800 dark:text-slate-100 text-sm focus:outline-none focus:ring-2 focus:ring-emerald-500 font-mono font-bold text-emerald-600 dark:text-emerald-400" readonly required>
                </div>

                <div>
                    <label class="block text-xs font-medium text-slate-500 dark:text-slate-300 mb-1">Keterangan</label>
                    <textarea id="keteranganInput" rows="3" placeholder="Keterangan singkat..." class="w-full px-3 py-2 rounded-lg border border-slate-200 dark:border-slate-600 bg-slate-50 dark:bg-slate-900 text-slate-800 dark:text-slate-100 text-sm focus:outline-none focus:ring-2 focus:ring-emerald-500"></textarea>
                </div>

                <div class="flex justify-end gap-2 pt-2">
                    <button type="button" onclick="closeModal()" class="px-4 py-2 rounded-lg text-sm text-slate-600 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-700 cursor-pointer">Batal</button>
                    <button type="submit" class="px-4 py-2 rounded-lg text-sm bg-emerald-600 hover:bg-emerald-500 dark:bg-emerald-600 dark:hover:bg-emerald-500 text-white font-medium shadow-md shadow-emerald-600/20 cursor-pointer">Simpan</button>
                </div>
            </form>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../assets/js/supabase.js"></script>
    
    <script>
        function applyTheme(theme) {
            const html = document.documentElement;
            const label = document.getElementById('themeLabel');

            if (theme === 'dark') {
                html.classList.add('dark');
                if (label) label.textContent = 'Mode Gelap';
            } else {
                html.classList.remove('dark');
                if (label) label.textContent = 'Mode Terang';
            }
            localStorage.setItem('theme', theme);
        }

        function toggleTheme() {
            const isDark = document.documentElement.classList.contains('dark');
            applyTheme(isDark ? 'light' : 'dark');
        }

        (function initTheme() {
            const savedTheme = localStorage.getItem('theme');
            if (savedTheme) {
                applyTheme(savedTheme);
            } else if (window.matchMedia('(prefers-color-scheme: dark)').matches) {
                applyTheme('dark');
            } else {
                applyTheme('light');
            }
        })();

        document.addEventListener('DOMContentLoaded', () => {
            const sessionData = localStorage.getItem('loggedInUser');
            
            if (!sessionData) {
                window.location.replace('login.html');
                return;
            }

            try {
                const user = JSON.parse(sessionData);
                const role = (user.role || '').toLowerCase();

                if (role === 'warga') {
                    alert('Akses Ditolak! Anda tidak memiliki izin mengakses halaman ini.');
                    window.location.replace('form-lapor.html');
                    return;
                }

                const nameElem = document.getElementById('userAdminName');
                const roleElem = document.getElementById('userAdminRole');
                if (nameElem) nameElem.textContent = user.nama || user.username || 'Pengguna';
                if (roleElem) roleElem.textContent = user.role || 'Admin';

                if (role === 'kadis' || role === 'pimpinan') {
                    const btnTambah = document.getElementById('btnTambahJenis');
                    if (btnTambah) btnTambah.style.display = 'none';
                }

            } catch (err) {
                localStorage.removeItem('loggedInUser');
                window.location.replace('login.html');
            }
        });

        function handleLogout() {
            localStorage.removeItem('loggedInUser');
            window.location.replace('login.html');
        }
    </script>

    <script src="../assets/js/jenis-ppks.js"></script>
    <script src="../assets/js/main.js"></script>
</body>
</html>
