<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - SIP-PPKS</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-slate-50 font-sans flex h-screen overflow-hidden">

    <aside class="w-64 bg-white text-slate-800 flex flex-col justify-between p-4 border-r border-slate-200 shrink-0 print:hidden">
        <div>
            <div class="flex items-center gap-3 mb-8 px-2">
                <i data-lucide="users" class="w-7 h-7 text-teal-600"></i>
                <span class="text-lg font-bold tracking-wide">SIP-PPKS</span>
            </div>
            
            <nav class="space-y-1">
                <a href="dashboard.html" class="flex items-center gap-3 px-4 py-2.5 rounded-lg bg-teal-600 text-white font-medium text-sm shadow-md shadow-teal-600/20 transition-all duration-200">
                    <i data-lucide="layout-dashboard" class="w-4 h-4"></i>
                    <span>Dashboard</span>
                </a>
                <a href="ppks.html" class="flex items-center gap-3 px-4 py-2.5 rounded-lg text-slate-600 hover:bg-slate-100 hover:text-slate-900 font-medium text-sm transition-all duration-200 hover:translate-x-1">
                    <i data-lucide="user-check" class="w-4 h-4"></i>
                    <span>Data PPKS</span>
                </a>
                <a href="jenis-ppks.html" class="flex items-center gap-3 px-4 py-2.5 rounded-lg text-slate-600 hover:bg-slate-100 hover:text-slate-900 font-medium text-sm transition-all duration-200 hover:translate-x-1">
                    <i data-lucide="tags" class="w-4 h-4"></i>
                    <span>Jenis PPKS</span>
                </a>
                <a href="laporan.html" class="flex items-center gap-3 px-4 py-2.5 rounded-lg text-slate-600 hover:bg-slate-100 hover:text-slate-900 font-medium text-sm transition-all duration-200 hover:translate-x-1">
                    <i data-lucide="file-text" class="w-4 h-4"></i>
                    <span>Laporan</span>
                </a>
            </nav>
        </div>

        <div class="space-y-3">
            <div class="border-t border-slate-200 pt-4 flex items-center justify-between px-2">
                <div class="flex items-center gap-2">
                    <i data-lucide="user-circle" class="w-5 h-5 text-teal-600"></i>
                    <div class="flex flex-col">
                        <span id="userAdminName" class="text-xs font-semibold text-slate-800">Pengguna</span>
                        <span id="userAdminRole" class="text-[10px] text-slate-500">Role</span>
                    </div>
                </div>
                <button type="button" onclick="handleLogout()" class="text-slate-400 hover:text-rose-500 transition-colors duration-200 p-1.5 rounded-lg hover:bg-rose-500/10 cursor-pointer" title="Keluar / Logout">
                    <i data-lucide="log-out" class="w-4 h-4"></i>
                </button>
            </div>
        </div>
    </aside>

    <main class="flex-1 overflow-y-auto p-8 transition-all duration-300 animate-fadeIn">
        
        <div class="mb-6">
            <h1 class="text-2xl font-bold text-slate-800">Dashboard Utama</h1>
            <p class="text-sm text-slate-500">Ringkasan statistik data Pemerlu Pelayanan Kesejahteraan Sosial.</p>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-8">
            <div class="bg-white p-5 rounded-xl border border-slate-200 shadow-sm flex items-center gap-4">
                <div class="p-3 bg-teal-50 text-teal-600 rounded-lg shrink-0">
                    <i data-lucide="users" class="w-6 h-6"></i>
                </div>
                <div>
                    <p class="text-xs text-slate-500 font-medium uppercase tracking-wider">Total Terdaftar</p>
                    <h3 id="dashTotalPPKS" class="text-xl font-bold text-slate-800">Memuat...</h3>
                </div>
            </div>

            <div class="bg-white p-5 rounded-xl border border-slate-200 shadow-sm flex items-center gap-4">
                <div class="p-3 bg-amber-50 text-amber-600 rounded-lg shrink-0">
                    <i data-lucide="tags" class="w-6 h-6"></i>
                </div>
                <div>
                    <p class="text-xs text-slate-500 font-medium uppercase tracking-wider">Kategori Aktif</p>
                    <h3 id="dashTotalKategori" class="text-xl font-bold text-slate-800">Memuat...</h3>
                </div>
            </div>

            <div class="bg-white p-5 rounded-xl border border-slate-200 shadow-sm flex items-center gap-4">
                <div class="p-3 bg-emerald-50 text-emerald-600 rounded-lg shrink-0">
                    <i data-lucide="check-circle-2" class="w-6 h-6"></i>
                </div>
                <div>
                    <p class="text-xs text-slate-500 font-medium uppercase tracking-wider">Sistem Status</p>
                    <h3 class="text-xl font-bold text-emerald-600">Aktif</h3>
                </div>
            </div>
        </div>

        <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
            <div class="lg:col-span-2 bg-white p-6 rounded-xl border border-slate-200 shadow-sm">
                <h3 class="text-base font-bold text-slate-800 mb-4">Sebaran Data per Jenis PPKS</h3>
                <div class="h-64 relative">
                    <canvas id="ppksChart"></canvas>
                </div>
            </div>

            <div class="bg-white p-6 rounded-xl border border-slate-200 shadow-sm flex flex-col justify-between">
                <div>
                    <div class="flex items-center justify-between mb-4">
                        <h3 class="text-base font-bold text-slate-800">Input Terbaru</h3>
                        <a href="ppks.html" class="text-xs text-teal-600 hover:underline">Lihat Semua</a>
                    </div>
                    <div id="recentList" class="space-y-3">
                        <p class="text-sm text-slate-400 text-center py-8">Memuat data...</p>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="../assets/js/supabase.js"></script>

    <script>
        // --- SCRIPT PROTEKSI USER DAN PROFILE SIDEBAR ---
        document.addEventListener('DOMContentLoaded', () => {
            const sessionData = localStorage.getItem('loggedInUser');
            
            if (!sessionData) {
                window.location.replace('login.html');
                return;
            }

            try {
                const user = JSON.parse(sessionData);
                const role = (user.role || '').toLowerCase();

                // Akses Warga dialihkan ke form lapor
                if (role === 'warga') {
                    alert('Akses Ditolak! Anda tidak memiliki izin mengakses halaman ini.');
                    window.location.replace('form-lapor.html');
                    return;
                }

                // Tampilkan info akun login
                const nameElem = document.getElementById('userAdminName');
                const roleElem = document.getElementById('userAdminRole');
                if (nameElem) nameElem.textContent = user.nama || user.username || 'Pengguna';
                if (roleElem) roleElem.textContent = user.role || 'Admin';

            } catch (err) {
                localStorage.removeItem('loggedInUser');
                window.location.replace('login.html');
            }

            if (typeof lucide !== 'undefined') {
                lucide.createIcons();
            }
        });

        function handleLogout() {
            localStorage.removeItem('loggedInUser');
            window.location.replace('login.html');
        }
    </script>

    <script src="../assets/js/dashboard.js"></script>
    <script src="../assets/js/main.js"></script>
</body>
</html>
