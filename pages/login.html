<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - SIP-PPKS</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-slate-100 flex items-center justify-center h-screen font-sans">

    <div class="w-full max-w-md bg-white p-8 rounded-2xl shadow-xl border border-slate-200 mx-4">
        <div class="text-center mb-8">
            <div class="inline-flex p-3 bg-teal-100 text-teal-600 rounded-xl mb-3">
                <i data-lucide="users" class="w-8 h-8"></i>
            </div>
            <h2 class="text-2xl font-bold text-slate-800">SIP-PPKS</h2>
            <p class="text-xs text-slate-500 mt-1">Masuk untuk mengakses sistem pelaporan warga</p>
        </div>

        <div id="alertError" class="hidden mb-4 p-3 bg-rose-50 border border-rose-200 text-rose-600 text-xs rounded-lg text-center font-medium"></div>

        <form id="loginForm" class="space-y-4">
            <div>
                <label class="block text-sm font-medium text-slate-700 mb-1">Username / NIK / HP / Email</label>
                <input type="text" id="loginUsername" required placeholder="Masukkan Username, NIK, atau Email..."
                    class="w-full px-4 py-2.5 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-teal-500 text-sm">
            </div>

            <div>
                <label class="block text-sm font-medium text-slate-700 mb-1">Password</label>
                <input type="password" id="loginPassword" required placeholder="••••••••"
                    class="w-full px-4 py-2.5 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-teal-500 text-sm">
            </div>

            <button type="submit" id="btnLogin" class="w-full py-2.5 bg-teal-600 hover:bg-teal-700 text-white font-medium rounded-lg text-sm shadow-lg shadow-teal-600/30 transition-all duration-200 flex items-center justify-center gap-2">
                <span>Masuk Sistem</span>
            </button>
        </form>

        <p class="text-center text-xs text-slate-500 mt-6">
            Belum punya akun warga? <a href="register-warga.html" class="text-teal-600 font-bold hover:underline">Daftar di sini</a>
        </p>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../assets/js/supabase.js"></script>
    <script>
        if (window.lucide) lucide.createIcons();

        // 1. Cek Sesi Login Valid
        const existingUser = localStorage.getItem('loggedInUser');
        if (existingUser) {
            try {
                const parsed = JSON.parse(existingUser);
                if (parsed && typeof parsed === 'object') {
                    if (parsed.role === 'warga') {
                        window.location.replace('form-lapor.html');
                    } else {
                        window.location.replace('dashboard.html');
                    }
                }
            } catch (e) {
                localStorage.removeItem('loggedInUser');
            }
        }

        // 2. Submit Logic Login
        document.getElementById('loginForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const userInput = document.getElementById('loginUsername').value.trim();
            const passInput = document.getElementById('loginPassword').value.trim();
            const alertBox = document.getElementById('alertError');
            const btn = document.getElementById('btnLogin');

            alertBox.classList.add('hidden');
            btn.disabled = true;
            btn.innerHTML = `<span>Memeriksa...</span>`;

            try {
                const client = window.supabaseClient || (typeof supabaseClient !== 'undefined' ? supabaseClient : null);

                if (!client) {
                    throw new Error('Koneksi Supabase belum terhubung! Periksa file assets/js/supabase.js');
                }

                let userData = null;

                // --- TAHAP 1: Tabel users_admin (Superadmin / Pimpinan) ---
                const { data: adminList, error: adminErr } = await client
                    .from('users_admin')
                    .select('*')
                    .or(`username.eq.${userInput},email.eq.${userInput}`)
                    .eq('password', passInput)
                    .limit(1);

                if (adminErr) throw adminErr;

                if (adminList && adminList.length > 0) {
                    const adminData = adminList[0];
                    userData = {
                        id: adminData.id,
                        nama: adminData.nama_lengkap || adminData.username,
                        email: adminData.email,
                        role: adminData.role || 'superadmin'
                    };
                } else {
                    // --- TAHAP 2: Tabel users_warga (Masyarakat) ---
                    const { data: wargaList, error: wargaErr } = await client
                        .from('users_warga')
                        .select('*')
                        .or(`nik.eq.${userInput},no_hp.eq.${userInput}`)
                        .eq('password', passInput)
                        .limit(1);

                    if (wargaErr) throw wargaErr;

                    if (wargaList && wargaList.length > 0) {
                        const wargaData = wargaList[0];
                        userData = {
                            id: wargaData.id,
                            nik: wargaData.nik,
                            nama: wargaData.nama_lengkap,
                            no_hp: wargaData.no_hp,
                            role: 'warga'
                        };
                    }
                }

                if (userData) {
                    localStorage.setItem('loggedInUser', JSON.stringify(userData));

                    // Redirect berdasarkan role
                    if (userData.role === 'warga') {
                        window.location.replace('form-lapor.html');
                    } else {
                        window.location.replace('dashboard.html');
                    }
                } else {
                    alertBox.textContent = 'Username / NIK / Password tidak cocok!';
                    alertBox.classList.remove('hidden');
                }

            } catch (err) {
                alertBox.textContent = 'Terjadi kesalahan: ' + err.message;
                alertBox.classList.remove('hidden');
            } finally {
                btn.disabled = false;
                btn.innerHTML = `<span>Masuk Sistem</span>`;
            }
        });
    </script>
</body>
</html>
