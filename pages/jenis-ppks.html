<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jenis PPKS - SIP-PPKS</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-slate-50 font-sans flex h-screen overflow-hidden">

    <aside class="w-64 bg-white text-slate-800 flex flex-col justify-between p-4 border-r border-slate-200 shrink-0 print:hidden">
        <div>
            <div class="flex items-center gap-3 mb-8 px-2">
                <i data-lucide="users" class="w-7 h-7 text-teal-600"></i>
                <span class="text-lg font-bold tracking-wide">SIP-PPKS</span>
            </div>
            
            <nav class="space-y-1">
                <a href="dashboard.html" class="flex items-center gap-3 px-4 py-2.5 rounded-lg text-slate-600 hover:bg-slate-100 hover:text-slate-900 font-medium text-sm transition-all duration-200 hover:translate-x-1">
                    <i data-lucide="layout-dashboard" class="w-4 h-4"></i>
                    <span>Dashboard</span>
                </a>
                <a href="ppks.html" class="flex items-center gap-3 px-4 py-2.5 rounded-lg text-slate-600 hover:bg-slate-100 hover:text-slate-900 font-medium text-sm transition-all duration-200 hover:translate-x-1">
                    <i data-lucide="user-check" class="w-4 h-4"></i>
                    <span>Data PPKS</span>
                </a>
                <a href="jenis-ppks.html" class="flex items-center gap-3 px-4 py-2.5 rounded-lg bg-teal-600 text-white font-medium text-sm shadow-md shadow-teal-600/20 transition-all duration-200">
                    <i data-lucide="tags" class="w-4 h-4"></i>
                    <span>Jenis PPKS</span>
                </a>
                <a href="laporan.html" class="flex items-center gap-3 px-4 py-2.5 rounded-lg text-slate-600 hover:bg-slate-100 hover:text-slate-900 font-medium text-sm transition-all duration-200 hover:translate-x-1">
                    <i data-lucide="file-text" class="w-4 h-4"></i>
                    <span>Laporan</span>
                </a>
            </nav>
        </div>

        <div class="space-y-3">
            <div class="border-t border-slate-200 pt-4 flex items-center justify-between px-2">
                <div class="flex items-center gap-2">
                    <i data-lucide="user-circle" class="w-5 h-5 text-teal-600"></i>
                    <div class="flex flex-col">
                        <span id="userAdminName" class="text-xs font-semibold text-slate-800">Pengguna</span>
                        <span id="userAdminRole" class="text-[10px] text-slate-500">Role</span>
                    </div>
                </div>
                <button type="button" onclick="handleLogout()" class="text-slate-400 hover:text-rose-500 transition-colors duration-200 p-1.5 rounded-lg hover:bg-rose-500/10 cursor-pointer" title="Keluar / Logout">
                    <i data-lucide="log-out" class="w-4 h-4"></i>
                </button>
            </div>
        </div>
    </aside>

    <main class="flex-1 overflow-y-auto p-8">
        <div class="flex items-center justify-between mb-6">
            <div>
                <h1 class="text-2xl font-bold text-slate-800">Master Jenis PPKS</h1>
                <p class="text-sm text-slate-500">Daftar kategori Pemerlu Pelayanan Kesejahteraan Sosial.</p>
            </div>
            <button id="btnTambahJenis" onclick="openModal()" class="flex items-center gap-2 px-4 py-2.5 rounded-lg bg-teal-600 hover:bg-teal-500 text-white font-medium text-sm shadow-md shadow-teal-600/20 transition-all cursor-pointer">
                <i data-lucide="plus" class="w-4 h-4"></i>
                <span>Tambah Jenis</span>
            </button>
        </div>

        <div class="bg-white rounded-xl border border-slate-200 p-6 shadow-sm">
            <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse">
                    <thead>
                        <tr class="border-b border-slate-200 text-xs font-semibold uppercase text-slate-400 tracking-wider">
                            <th class="py-3 px-4">No</th>
                            <th class="py-3 px-4">Kode</th>
                            <th class="py-3 px-4">Nama Jenis PPKS</th>
                            <th class="py-3 px-4">Keterangan</th>
                        </tr>
                    </thead>
                    <tbody id="jenisTableBody">
                        <tr>
                            <td colspan="4" class="text-center py-6 text-slate-400">Memuat data...</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </main>

    <div id="jenisModal" class="hidden fixed inset-0 bg-slate-900/60 backdrop-blur-sm flex items-center justify-center p-4 z-50">
        <div class="bg-white w-full max-w-md rounded-xl border border-slate-200 p-6 shadow-xl">
            <div class="flex items-center justify-between mb-4">
                <h3 class="text-lg font-bold text-slate-800">Tambah Jenis PPKS</h3>
                <button type="button" onclick="closeModal()" class="text-slate-400 hover:text-slate-600 cursor-pointer">
                    <i data-lucide="x" class="w-5 h-5"></i>
                </button>
            </div>
            <form id="formJenisPPKS" onsubmit="handleAddJenisPPKS(event)" class="space-y-4">
                <div>
                    <label class="block text-xs font-medium text-slate-500 mb-1">Nama Jenis PPKS</label>
                    <select id="namaJenisInput" onchange="autoFillKode()" class="w-full px-3 py-2 rounded-lg border border-slate-200 bg-slate-50 text-slate-800 text-sm focus:outline-none focus:ring-2 focus:ring-teal-500" required>
                        <option value="">-- Pilih Jenis PPKS --</option>
                        <option value="Anak Balita Terlantar" data-kode="PPKS-01">Anak Balita Terlantar</option>
                        <option value="Anak Terlantar" data-kode="PPKS-02">Anak Terlantar</option>
                        <option value="Anak yang Berhadapan dengan Hukum" data-kode="PPKS-03">Anak yang Berhadapan dengan Hukum</option>
                        <option value="Anak Jalanan" data-kode="PPKS-04">Anak Jalanan</option>
                        <option value="Anak Kedagunan / Masalah Perilaku" data-kode="PPKS-05">Anak Kedagunan / Masalah Perilaku</option>
                        <option value="Anak Membutuhkan Perlindungan Khusus (AMPK)" data-kode="PPKS-06">Anak Membutuhkan Perlindungan Khusus (AMPK)</option>
                        <option value="Lanjut Usia Terlantar" data-kode="PPKS-07">Lanjut Usia Terlantar</option>
                        <option value="Penyandang Disabilitas" data-kode="PPKS-08">Penyandang Disabilitas</option>
                        <option value="Tuna Susila" data-kode="PPKS-09">Tuna Susila</option>
                        <option value="Gelandangan" data-kode="PPKS-10">Gelandangan</option>
                        <option value="Pengemis" data-kode="PPKS-11">Pengemis</option>
                        <option value="Pemulung" data-kode="PPKS-12">Pemulung</option>
                        <option value="Kelompok Minoritas" data-kode="PPKS-13">Kelompok Minoritas</option>
                        <option value="Bekas Warga Binaan Pemasyarakatan (BWBP)" data-kode="PPKS-14">Bekas Warga Binaan Pemasyarakatan (BWBP)</option>
                        <option value="Orang Dengan HIV/AIDS (ODHA)" data-kode="PPKS-15">Orang Dengan HIV/AIDS (ODHA)</option>
                        <option value="Korban Penyalahgunaan NAPZA" data-kode="PPKS-16">Korban Penyalahgunaan NAPZA</option>
                        <option value="Korban Trafficking (Perdagangan Orang)" data-kode="PPKS-17">Korban Trafficking (Perdagangan Orang)</option>
                        <option value="Korban Tindak Kekerasan" data-kode="PPKS-18">Korban Tindak Kekerasan</option>
                        <option value="Pekerja Migran Bermasalah Sosial (PMBS)" data-kode="PPKS-19">Pekerja Migran Bermasalah Sosial (PMBS)</option>
                        <option value="Korban Bencana Alam" data-kode="PPKS-20">Korban Bencana Alam</option>
                        <option value="Korban Bencana Sosial" data-kode="PPKS-21">Korban Bencana Sosial</option>
                        <option value="Perempuan Rawan Sosial Ekonomi" data-kode="PPKS-22">Perempuan Rawan Sosial Ekonomi</option>
                        <option value="Fakir Miskin" data-kode="PPKS-23">Fakir Miskin</option>
                        <option value="Keluarga Berpotensi Rawan Sosial Ekonomi" data-kode="PPKS-24">Keluarga Berpotensi Rawan Sosial Ekonomi</option>
                        <option value="Keluarga Bermasalah Psikososial" data-kode="PPKS-25">Keluarga Bermasalah Psikososial</option>
                        <option value="Komunitas Adat Terpencil (KAT)" data-kode="PPKS-26">Komunitas Adat Terpencil (KAT)</option>
                    </select>
                </div>

                <div>
                    <label class="block text-xs font-medium text-slate-500 mb-1">Kode Jenis (Terisi Otomatis)</label>
                    <input type="text" id="kodeJenisInput" placeholder="PPKS-XX" class="w-full px-3 py-2 rounded-lg border border-slate-200 bg-slate-50 text-slate-800 text-sm focus:outline-none focus:ring-2 focus:ring-teal-500 font-mono font-bold text-teal-600" readonly required>
                </div>

                <div>
                    <label class="block text-xs font-medium text-slate-500 mb-1">Keterangan</label>
                    <textarea id="keteranganInput" rows="3" placeholder="Keterangan singkat..." class="w-full px-3 py-2 rounded-lg border border-slate-200 bg-slate-50 text-slate-800 text-sm focus:outline-none focus:ring-2 focus:ring-teal-500"></textarea>
                </div>

                <div class="flex justify-end gap-2 pt-2">
                    <button type="button" onclick="closeModal()" class="px-4 py-2 rounded-lg text-sm text-slate-600 hover:bg-slate-100 cursor-pointer">Batal</button>
                    <button type="submit" class="px-4 py-2 rounded-lg text-sm bg-teal-600 hover:bg-teal-500 text-white font-medium shadow-md shadow-teal-600/20 cursor-pointer">Simpan</button>
                </div>
            </form>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../assets/js/supabase.js"></script>
    
    <script>
        // --- SCRIPT PROTEKSI DAN PENYESUAIAN HAK AKSES ---
        document.addEventListener('DOMContentLoaded', () => {
            const sessionData = localStorage.getItem('loggedInUser');
            
            if (!sessionData) {
                window.location.replace('login.html');
                return;
            }

            try {
                const user = JSON.parse(sessionData);
                const role = (user.role || '').toLowerCase();

                // Tendang Warga
                if (role === 'warga') {
                    alert('Akses Ditolak! Anda tidak memiliki izin mengakses halaman ini.');
                    window.location.replace('form-lapor.html');
                    return;
                }

                // Tampilkan info user
                const nameElem = document.getElementById('userAdminName');
                const roleElem = document.getElementById('userAdminRole');
                if (nameElem) nameElem.textContent = user.nama || user.username || 'Pengguna';
                if (roleElem) roleElem.textContent = user.role || 'Admin';

                // Jika Kadis / Pimpinan -> Sembunyikan tombol Tambah Jenis
                if (role === 'kadis' || role === 'pimpinan') {
                    const btnTambah = document.getElementById('btnTambahJenis');
                    if (btnTambah) btnTambah.style.display = 'none';
                }

            } catch (err) {
                localStorage.removeItem('loggedInUser');
                window.location.replace('login.html');
            }
        });

        function handleLogout() {
            localStorage.removeItem('loggedInUser');
            window.location.replace('login.html');
        }
    </script>

    <script src="../assets/js/jenis-ppks.js"></script>
    <script src="../assets/js/main.js"></script>
</body>
</html>
